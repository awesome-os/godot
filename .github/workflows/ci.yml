name: Awesome-OS Godot 4 CAS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install zstd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - name: Run Godot 4 CAS & CLI tests
        run: node --test test/godot-cas.test.mts

      - name: Cross-compile all 5 native C11 launcher targets (Zig 0.14.1, 0 warnings)
        run: |
          mkdir -p dist
          zig cc -target x86_64-windows-gnu -std=c11 -Os -s -Wl,--subsystem,windows -Wall -Wextra src/godot_launcher.c -lgdi32 -luser32 -o dist/godot.exe
          zig cc -target x86_64-linux-musl -static -std=c11 -Os -s -Wall -Wextra src/godot_launcher.c -o dist/godot-linux-x64
          zig cc -target aarch64-linux-musl -static -std=c11 -Os -s -Wall -Wextra src/godot_launcher.c -o dist/godot-linux-arm64
          zig cc -target aarch64-macos -std=c11 -Os -s -Wall -Wextra src/godot_launcher.c -o dist/godot-macos-arm64
          zig cc -target wasm32-wasi -std=c11 -Os -s -Wall -Wextra src/godot_launcher.c -o dist/godot.wasm
          ls -lh dist/
          ./dist/godot-linux-x64 --version
